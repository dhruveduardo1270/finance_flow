{% extends "base.html" %}

{% block content %}
<header class="page-header">
    <h1>Novo Lançamento</h1>
    <p>Adicione uma nova receita ou despesa ao seu controle.</p>
</header>

<div class="card form-card">
    <form action="{{ url_for('transactions.add_transaction') }}" method="POST" id="transactionForm">
        
        <div class="form-group">
            <label>Tipo de Lançamento</label>
            <div class="radio-group">
                <label class="radio-btn">
                    <input type="radio" name="type" value="expense" checked id="typeExpense">
                    <span>Despesa</span>
                </label>
                <label class="radio-btn">
                    <input type="radio" name="type" value="income" id="typeIncome">
                    <span>Receita</span>
                </label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half-width">
                <label for="amount">Valor (R$)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required placeholder="0,00">
            </div>

            <div class="form-group half-width">
                <label for="date">Data</label>
                <!-- O JavaScript vai preencher este campo com a data de hoje por padrão -->
                <input type="date" id="date" name="date" required>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Descrição</label>
            <input type="text" id="description" name="description" required placeholder="Ex: Conta de Luz, Salário, etc.">
        </div>

        <div class="form-group">
            <label for="category_id">Categoria</label>
            <select id="category_id" name="category_id" required>
                <option value="">Selecione uma categoria...</option>
                <!-- As opções serão populadas dinamicamente via JavaScript dependendo do tipo selecionado -->
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Observações (opcional)</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Detalhes adicionais..."></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Lançamento</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Este script é específico desta página
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Preencher a data de hoje por padrão
        document.getElementById('date').valueAsDate = new Date();
        
        // 2. Lógica para atualizar categorias com base no tipo
        const typeRadios = document.querySelectorAll('input[name="type"]');
        const categorySelect = document.getElementById('category_id');
        
        function updateCategories(type) {
            // Fazer a requisição para a nossa API usando Fetch
            fetch(`/api/categories?type=${type}`)
                .then(response => response.json())
                .then(categories => {
                    // Limpa as opções atuais
                    categorySelect.innerHTML = '<option value="">Selecione uma categoria...</option>';
                    
                    // Adiciona as novas opções
                    categories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.id;
                        option.textContent = cat.name;
                        categorySelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Erro ao buscar categorias:', error));
        }
        
        // Atualiza as categorias na carga inicial da página (padrão é despesa)
        updateCategories('expense');
        
        // Adiciona evento de mudança aos botões de rádio (despesa/receita)
        typeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                updateCategories(e.target.value);
            });
        });
    });
</script>
{% endblock %}
